[package]
name = "traducir-textos-ingles-a-espanol"
version = "1.0.0"
description = "Traducir textos inglés a español (v1.0.0) - Traductor local offline hasta 20.000 caracteres"
authors = ["Victoria Sanjurjo"]
license = "MIT"
edition = "2021"

[lib]
name = "traducir_textos_lib"
crate-type = ["rlib"]

[profile.dev]
debug = 0

[profile.test]
debug = 0

[profile.release]
debug = 0
strip = true
lto = false
codegen-units = 4

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
once_cell = "1.20"
