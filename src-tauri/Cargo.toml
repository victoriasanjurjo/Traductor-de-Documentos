[package]
name = "traductor-documentos-en-es"
version = "1.0.0"
description = "Traductor de Documentos - Inglés a Español (v1.0.0) - Traductor local offline de documentos PDF"
authors = ["Victoria Sanjurjo"]
license = "MIT"
edition = "2021"

[lib]
name = "traductor_documentos_lib"
crate-type = ["rlib"]

[profile.dev]
debug = 0

[profile.test]
debug = 0

[profile.release]
debug = 0
strip = true
lto = false
codegen-units = 4

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
lopdf = "0.34"
printpdf = "0.7"
rfd = "0.15"
once_cell = "1.20"
